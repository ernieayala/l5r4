name: Create Release

# Sets the version, tags it, and publishes the release with its manifest and zip. The zip holds only the files
# tools/release-files.mjs lists, and system.json's version and URLs come from tools/manifest.mjs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 4.0.0 or 4.0.0-rc.1)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - release
          - prerelease
      changelog:
        description: 'Changelog content (optional - will extract from CHANGELOG.MD if empty)'
        required: false
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUSKY: 0
      INPUT_VERSION: ${{ github.event.inputs.version }}
      RELEASE_TYPE: ${{ github.event.inputs.release_type }}
      CUSTOM_CHANGELOG: ${{ github.event.inputs.changelog }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Normalize version
        id: normalize_version
        run: |
          VERSION="${INPUT_VERSION#Release v}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already exists
        env:
          VERSION: ${{ steps.normalize_version.outputs.VERSION }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Version tag v$VERSION already exists"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build CSS
        run: npm run build:css

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Circular imports
        run: npm run deps:circular

      - name: Compendium packs
        run: npm run build:packs

      - name: Coverage
        run: npm run coverage:check

      # tools/manifest.mjs validates the version and type, and changes only system.json's version and URLs
      - name: Update version in files
        env:
          VERSION: ${{ steps.normalize_version.outputs.VERSION }}
        run: |
          node tools/manifest.mjs "$VERSION" "$RELEASE_TYPE"
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
          fi

      - name: Extract changelog
        env:
          VERSION: ${{ steps.normalize_version.outputs.VERSION }}
        run: |
          if [ -n "$CUSTOM_CHANGELOG" ]; then
            printf '%s\n' "$CUSTOM_CHANGELOG" > "$RUNNER_TEMP/changelog.md"
          elif grep -qF "[$VERSION]" CHANGELOG.MD; then
            awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.MD > "$RUNNER_TEMP/changelog.md"
          else
            echo "No CHANGELOG.MD entry for $VERSION"
            exit 1
          fi

      - name: Create system ZIP
        run: |
          node tools/release-files.mjs > "$RUNNER_TEMP/release-files.txt"
          zip -q l5r4.zip -@ < "$RUNNER_TEMP/release-files.txt"
          unzip -l l5r4.zip

      - name: Commit version changes
        env:
          VERSION: ${{ steps.normalize_version.outputs.VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json system.json
          git commit -m "chore: Bump version to $VERSION"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.normalize_version.outputs.VERSION }}
        run: |
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.normalize_version.outputs.VERSION }}
        run: |
          PRERELEASE=()
          if [[ "$VERSION" == *-* || "$RELEASE_TYPE" == "prerelease" ]]; then
            PRERELEASE=(--prerelease)
          fi
          gh release create "v$VERSION" system.json l5r4.zip \
            --verify-tag \
            --title "Release v$VERSION" \
            --notes-file "$RUNNER_TEMP/changelog.md" \
            "${PRERELEASE[@]}"
