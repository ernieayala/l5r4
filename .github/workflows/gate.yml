name: Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build CSS
        run: npm run build:css

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Circular imports
        run: npm run deps:circular

      - name: Compendium packs
        run: npm run build:packs

      # Citations, actions, settings, and pack entries against tools/coverage/manifest.json; the page check needs
      # game-rules/, which is not in the repo, and runs locally (roadmap/STAGE-16 decision 3)
      - name: Coverage
        run: npm run coverage:check
