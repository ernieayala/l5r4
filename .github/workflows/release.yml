name: Release L5R4 System

# Attaches the manifest and zip to a release published by hand on GitHub. A release the Create Release workflow
# publishes carries them already, and GitHub starts no workflow for an event made with GITHUB_TOKEN, so this does not
# run for it.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUSKY: 0
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build CSS
        run: npm run build:css

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Circular imports
        run: npm run deps:circular

      - name: Compendium packs
        run: npm run build:packs

      - name: Coverage
        run: npm run coverage:check

      # tools/manifest.mjs validates the version, and changes only system.json's version and URLs
      - name: Update system.json version and URLs
        run: |
          VERSION="${TAG#v}"
          TYPE=release
          if [ "$PRERELEASE" = "true" ]; then
            TYPE=prerelease
          fi
          node tools/manifest.mjs "$VERSION" "$TYPE"

      - name: Create system ZIP
        run: |
          node tools/release-files.mjs > "$RUNNER_TEMP/release-files.txt"
          zip -q l5r4.zip -@ < "$RUNNER_TEMP/release-files.txt"
          unzip -l l5r4.zip

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" system.json l5r4.zip --clobber
